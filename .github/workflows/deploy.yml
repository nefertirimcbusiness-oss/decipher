name: Deploy to Vercel (production)

# The Vercel project has no Git integration, so this workflow is the thing that
# makes "merge to main" actually deploy. It needs ONE repository secret:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: VERCEL_TOKEN   Value: the Vercel access token
# Until that secret exists the job does nothing and says so in the run summary.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for VERCEL_TOKEN
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice title=Auto-deploy skipped::No VERCEL_TOKEN repository secret is configured, so this merge was NOT deployed. Add the secret to enable auto-deploy, or run 'npm run deploy' from the team box."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Link Vercel project
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p .vercel

          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_ju65TMkqGNHGQuRt3iKvYPPN421X","orgId":"team_xZANYaO9IGtpSMuOUiDCGiOJ","projectName":"decipher-repo"}
          JSON

      - name: Deploy to production
        if: steps.check.outputs.skip == 'false'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Verify the live site
        if: steps.check.outputs.skip == 'false'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          sleep 10
          bash scripts/deploy.sh --verify-only
